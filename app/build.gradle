    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

tasks.register("downloadImageFS") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File imageFS = new File(assetDir, "imagefs.tar.zst")
    int parts = 2

    doLast {
        if (!imageFS.exists()) {
            println("ImageFS was not present, downloading...\n")
            FileOutputStream outputStream = new FileOutputStream(imageFS)
            for (int i = 0; i < parts; i++) {
                File partFile = new File(assetDir, String.format("imagefs.tar.zst.%02d", i))
                String partURL = String.format("https://raw.githubusercontent.com/Other-backup/winlator-imagefs-v2/main/imagefs.tar.zst.%02d", i)
                new URL(partURL).withInputStream { p ->
                    partFile.withOutputStream { it << p }
                    outputStream << partFile.bytes
                }
                partFile.delete()
            }
            outputStream.close()
        }
    }
}

tasks.register("downloadProton") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File protonARM64EC = new File(assetDir, "proton-9.0-arm64ec.tar.zst")
    File staleProtonARM64EC = new File(assetDir, "proton-10.0-5-arm64ec.tar.zst")
    String protonURL = "https://github.com/Other-backup/winlator-imagefs-v2/releases/download/c/proton-9.0-arm64ec.tar.zst"
    String protonSHA256 = "5f9375640479a5b2c4c3998fda689bb5085febc8fcdb7b6998c79d925392991a"
    long protonSize = 73570637L

    def fileSHA256 = { File file ->
        MessageDigest digest = MessageDigest.getInstance("SHA-256")
        file.withInputStream { input ->
            byte[] buffer = new byte[64 * 1024]
            int read
            while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
        }
        digest.digest().collect { String.format("%02x", ((int) it) & 0xff) }.join()
    }

    doLast {
        if (staleProtonARM64EC.exists()) staleProtonARM64EC.delete()

        boolean valid = protonARM64EC.isFile()
                && protonARM64EC.length() == protonSize
                && fileSHA256(protonARM64EC).equalsIgnoreCase(protonSHA256)
        if (!valid) {
            if (protonARM64EC.exists()) protonARM64EC.delete()
            println("Proton 9 ARM64EC was not present or failed validation, downloading...\n")
            new URL(protonURL).withInputStream { input ->
                protonARM64EC.withOutputStream { output -> output << input }
            }
            valid = protonARM64EC.isFile()
                    && protonARM64EC.length() == protonSize
                    && fileSHA256(protonARM64EC).equalsIgnoreCase(protonSHA256)
            if (!valid) {
                protonARM64EC.delete()
                throw new GradleException("Downloaded Proton 9 ARM64EC archive failed size/SHA-256 validation")
            }
        }
    }
}

tasks.register("prepareKotlinBuildScriptModel"){}
downloadProton.dependsOn(downloadImageFS)
preBuild.dependsOn(downloadProton)

// The debug build reads its registry (contents.json, linux.json) from the branch of winlator-skynet-components that is
// named like the branch this checkout is on, when that repository has one; otherwise from main. A release build always
// reads main.
def currentBranch = providers.exec {
    commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
    workingDir = rootDir
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() }
def debugComponentsBranch = providers.provider {
    String branch = currentBranch.get()
    if (branch.isEmpty() || branch == 'HEAD') return 'main'
    String listed = providers.exec {
        commandLine 'git', 'ls-remote', '--heads', 'https://github.com/skynetigor/winlator-skynet-components.git', branch
        ignoreExitValue = true
    }.standardOutput.asText.get()
    return listed.trim().isEmpty() ? 'main' : branch
}

android {
    namespace 'com.winlator.cmod'
    // Keep compileSdk from your current config. If you want to match Termux-X11, you could set to 34.
    compileSdk 35
    buildToolsVersion "35.0.0"

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        // Side-by-side install: keeps the upstream Ludashi build and its containers intact.
        // namespace stays com.winlator.cmod so relative manifest class names still resolve.
        applicationId "com.winlator.cmod.dev"
        manifestPlaceholders = [appLabel: "SkyNetEmu"]
        minSdkVersion 28
        // We’re preserving Winlator’s request to keep targetSdkVersion at 28
        targetSdkVersion 28

        versionCode 23
        versionName "2.0.0"

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        // You originally only did arm64-v8a. If you want multi-ABI splits, see below.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=androidx.compose.material3.ExperimentalMaterial3Api']
    }

    // The debug build is a separate app (com.winlator.cmod.dev2) next to the release build.
    // A suffix cannot do this: it always adds a dot, and a package segment cannot start with a digit.

    // Keep Winlator’s buildTypes
    buildTypes {
        debug {
            buildConfigField 'String', 'COMPONENTS_BRANCH', "\"${debugComponentsBranch.get()}\""
            minifyEnabled false
            // A separate app next to the release build: its own package, so no data or signature is shared.
            manifestPlaceholders = [appLabel: "SkyNetEmu"]
        }
        release {
            buildConfigField 'String', 'COMPONENTS_BRANCH', '"main"'
            minifyEnabled false
            signingConfig signingConfigs.debug
            crunchPngs false
        }
    }

    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // If you want to be sure modern JNI packaging is used:
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            pickFirsts += ["assets/dexopt/baseline.prof", "assets/dexopt/baseline.profm"]
        }
    }

    buildFeatures {
        buildConfig = true
        prefab = true
        compose = true
    }
}

